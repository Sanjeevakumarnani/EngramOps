{% extends 'base.html' %}
{% block content %}
<section class="card hero-small"><div><span class="eyebrow">Memory-backed analysis</span><h1>Latest change review</h1><p class="muted">{{ hindsight_status }}</p></div><a class="button" href="/">Back to dashboard</a></section>
<div id="analysis-root" class="stack"><div class="card"><p>Loading analysis…</p></div></div>
<script>
async function loadAnalysis(){const root=document.getElementById('analysis-root');const r=await fetch('/api/latest-analysis');const data=await r.json();if(!data.analysis){root.innerHTML='<section class="card"><p>No analysis yet.</p></section>';return;}const a=data.analysis;const list=xs=>xs&&xs.length?'<ul>'+xs.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>':'<p class="muted">None surfaced.</p>';const memories=data.similar&&data.similar.length?data.similar.map(x=>'<div class="memory-card"><div class="small muted">'+escapeHtml(x.type||'memory')+'</div><div>'+escapeHtml(x.text||'')+'</div></div>').join(''):'<p class="muted">No historical matches returned.</p>';root.innerHTML='<section class="card"><div class="risk-banner risk-'+a.risk_level+'">Risk '+a.risk_level.toUpperCase()+' · Confidence '+a.confidence.toUpperCase()+'</div><h2>Summary</h2><p>'+escapeHtml(a.summary||'')+'</p></section><div class="grid two"><section class="card"><h2>Recurring patterns</h2>'+list(a.recurring_patterns)+'<h2>Likely failure mechanisms</h2>'+list(a.likely_failure_mechanisms)+'</section><section class="card"><h2>Preventative actions</h2>'+list(a.preventative_actions)+'<h2>Exceptions / contradictions</h2>'+list(a.contradictions_or_exceptions)+'</section></div><section class="card"><h2>Historical memory recalled</h2><div class="stack compact">'+memories+'</div></section><section class="card"><h2>Evidence</h2>'+list(a.evidence)+'</section>';}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}loadAnalysis();
</script>
{% endblock %}
