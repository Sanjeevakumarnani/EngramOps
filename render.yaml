services:
  - type: web
    name: engramops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HINDSIGHT_BASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: ENGRAMOPS_DB_PATH
        value: data/engramops.db